spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3307/huixuetong?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&allowPublicKeyRetrieval=true
    username: huixuetong
    password: ${DB_PASSWORD:huixuetong123456}

# AI 智能助手配置（测试环境）
ai:
  api-key: ${longcat-api:test-api-key}
  api-url: https://api.longcat.chat/openai/v1/chat/completions
  model: LongCat-2.0-Preview
  max-tokens: 500
  temperature: 0.3

# MyBatis 相关配置
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

# 配置事务管理日志级别
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug
    com.huixuetong.security.sql: debug
