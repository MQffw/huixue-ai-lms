# ============================================================
# MySQL 8.0 开发实例配置
#   basedir : C:\Program Files\MySQL\MySQL Server 8.0
#   datadir : C:\ProgramData\MySQL\MySQL Server 8.0\Data-hxt
#   port    : 3307（5.5 占着 3306，两个实例并存）
#
# 用法：解压 ZIP 后，把本文件复制为
#       "C:\Program Files\MySQL\MySQL Server 8.0\my.ini"
#       （mysqld 启动时会自动读取 basedir 下的 my.ini）
#
# 注意：不要复用 C:\ProgramData\MySQL\MySQL Server 8.0\Data，
#       那是以前安装残留，非空且权限/端口配置都不同。
# ============================================================
[mysqld]
basedir="C:/Program Files/MySQL/MySQL Server 8.0"
datadir="C:/ProgramData/MySQL/MySQL Server 8.0/Data-hxt"
port=3307

# 字符集：从库到连接全部 utf8mb4，emoji 才不会报 1366
character-set-server=utf8mb4
collation-server=utf8mb4_general_ci

# 时区：与 application-mysql8.yml 的 serverTimezone=Asia/Shanghai 对齐
default-time-zone=+08:00

# 兼容 5.5 导出的历史 DDL / 数据（零日期、非严格截断）
# 数据稳定后可改为：STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
sql-mode=NO_ENGINE_SUBSTITUTION

# Windows 默认即 1；显式写出，避免以后把数据目录搬去 Linux 时表名大小写不一致
lower_case_table_names=1

max_allowed_packet=64M
max_connections=200
innodb_buffer_pool_size=512M

log-error="C:/ProgramData/MySQL/MySQL Server 8.0/Data-hxt/error.log"
slow_query_log=1
long_query_time=1

# 如需关闭 X Protocol（默认 33060），取消下一行注释；
# 个别 8.0 小版本不认该参数，若启动报 unknown variable 就保持注释
# mysqlx=0

[client]
port=3307
default-character-set=utf8mb4

[mysql]
default-character-set=utf8mb4
